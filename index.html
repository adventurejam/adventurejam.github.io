<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdventureJam</title>
  <meta http-equiv="refresh" content="3; url=https://你的游戏地址" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .card {
      text-align: center;
      padding: 48px 32px;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      backdrop-filter: blur(10px);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 2.5rem;
    }
    p {
      margin: 0 0 24px;
      font-size: 1.1rem;
      color: #dbeafe;
    }
    a {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 999px;
      background: #38bdf8;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }
    a:hover {
      background: #0ea5e9;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>AdventureJam</h1>
    <p>正在进入游戏页面，请稍候...</p>
    <a href="https://你的游戏地址">立即进入游戏</a>
  </div>
</body>
</html>
